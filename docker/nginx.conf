# Only send `Connection: upgrade` for actual WebSocket handshakes; plain REST
# requests keep a normal keep-alive connection.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend REST API + WebSocket streams.
    # All endpoints — including the WebSocket streams at /api/stream/data and
    # /api/stream/agent/... — live under /api/, so the upgrade headers below
    # cover both plain REST calls and the WebSocket handshakes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        # Dashboard image uploads: the backend accepts up to IOS_MAX_IMAGE_BYTES
        # (5 MiB by default), so nginx's 1m default would 413 them first.
        client_max_body_size 10m;
    }
}
