server {
    listen 5173;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy backend REST API + WebSocket streams.
    # All endpoints — including the WebSocket streams at /api/stream/data and
    # /api/stream/agent/... — live under /api/, so the upgrade headers below
    # cover both plain REST calls and the WebSocket handshakes.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }
}
