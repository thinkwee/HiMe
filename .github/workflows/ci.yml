name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff pytest pytest-asyncio

      - name: Lint with ruff
        run: ruff check backend/ tests/

      - name: Run tests
        run: pytest tests/ -x -q
        env:
          DEFAULT_LLM_PROVIDER: gemini
          GEMINI_API_KEY: ci-placeholder

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --run

  scripts:
    name: Shell scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Syntax check
        run: |
          bash -n hime.sh
          bash -n setup.sh
          sh -n docker/entrypoint-backend.sh

      # -S error keeps the gate on real bugs (unbound vars, bad quoting that
      # changes behaviour) without failing the build on style nitpicks.
      - name: ShellCheck
        run: shellcheck -S error hime.sh setup.sh docker/entrypoint-backend.sh

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Every service declares `env_file: - .env`, so compose needs the file
      # to exist before it can resolve the project model.
      - name: Seed .env
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config -q

      - name: Build images
        run: docker compose build
